name: "Redaction-CI"
description: >-
  Fails CI when a committed PDF still contains recoverable text under its
  redaction boxes: x-ray redactions, unapplied redaction annotations,
  invisible or camouflaged text, off-page text, screenshots over live text,
  filled form fields, attachments and earlier revisions left by incremental
  saves. No secrets, no token; the detector itself makes no network calls.
author: "Gjusev"

branding:
  icon: "eye-off"
  color: "black"

inputs:
  paths:
    description: >-
      Newline-separated glob(s) of PDFs to scan, relative to the repository
      root. A line starting with "!" excludes that glob, e.g.
      "contracts/**/*.pdf\n!**/drafts/**". Matching is case-insensitive.
    required: false
    default: "**/*.pdf"
  exclude:
    description: "Newline-separated glob(s) to exclude from the scan."
    required: false
    default: ""
  fail-on:
    description: >-
      "confirmed" (default) fails on extractable text under a box, unapplied
      redaction annotations and recoverable earlier revisions; "any" also
      fails on invisible/camouflaged text, form values, attachments and the
      other warnings.
    required: false
    default: "confirmed"
  max-fill-luma:
    description: >-
      A filled path counts as a redaction box if its perceived luminance is
      at most this value (0..1). Lower = only dark boxes; raise to also flag
      white-outs. Default 0.85.
    required: false
    default: "0.85"
  min-overlap:
    description: >-
      Minimum fraction of a text run's bounding box a box must cover to
      count as hiding it (0..1). Default 0.5.
    required: false
    default: "0.5"
  min-fill-opacity:
    description: "Minimum fill opacity for a box to count as covering (0..1). Default 0.5."
    required: false
    default: "0.5"
  format:
    description: "stdout format of the scan step: text (human) or json (machine-readable)."
    required: false
    default: "text"

outputs:
  findings:
    description: "Total number of findings."
    value: ${{ steps.scan.outputs.findings }}
  confirmed:
    description: "Findings with severity 'confirmed' (leaks fail the build by default)."
    value: ${{ steps.scan.outputs.confirmed }}
  warnings:
    description: "Findings with severity 'warning' (visible in annotations/summary)."
    value: ${{ steps.scan.outputs.warnings }}
  files:
    description: "Number of PDFs scanned."
    value: ${{ steps.scan.outputs.files }}
  pages:
    description: "Number of pages scanned."
    value: ${{ steps.scan.outputs.pages }}
  files-with-findings:
    description: "Number of PDFs with at least one finding."
    value: ${{ steps.scan.outputs.files-with-findings }}
  matched:
    description: >-
      "true" if findings matched the fail-on policy (the step then exits
      non-zero: 1 on findings, 2 on scan errors).
    value: ${{ steps.scan.outputs.matched }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install detector dependency
      shell: bash
      run: python -m pip install --no-cache-dir --requirement "${{ github.action_path }}/requirements.txt"

    # Inputs reach the script via env, never via ${{ }} inside the run block:
    # textual interpolation before the shell parses is a script-injection
    # vector whenever an input is wired to untrusted context.
    - name: Scan PDFs
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_FILL_LUMA: ${{ inputs.max-fill-luma }}
        MIN_OVERLAP: ${{ inputs.min-overlap }}
        MIN_FILL_OPACITY: ${{ inputs.min-fill-opacity }}
        FORMAT: ${{ inputs.format }}
      run: |
        python "${{ github.action_path }}/redaction_ci.py" \
          --paths "$PATHS" \
          --exclude "$EXCLUDE" \
          --fail-on "$FAIL_ON" \
          --max-fill-luma "$MAX_FILL_LUMA" \
          --min-overlap "$MIN_OVERLAP" \
          --min-fill-opacity "$MIN_FILL_OPACITY" \
          --format "$FORMAT" \
          --annotations auto \
          --summary-file "${GITHUB_STEP_SUMMARY:-}"
